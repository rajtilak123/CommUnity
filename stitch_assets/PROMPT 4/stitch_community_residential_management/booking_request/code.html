<style>
        body { background-color: #f8f9ff; color: #0b1c30; }
        .input-glow:focus-within {
            border-color: #3525cd;
            box-shadow: 0 0 0 2px rgba(53, 37, 205, 0.2);

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="antialiased font-body-lg text-body-lg flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest dark:bg-inverse-surface fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile md:px-lg h-16">
<div class="flex items-center gap-sm cursor-pointer hover:bg-surface-variant dark:hover:bg-inverse-on-surface transition-colors rounded-full p-2" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</div>
<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">New Booking</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim invisible">notifications</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile md:px-lg max-w-2xl mx-auto w-full">
<div class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Book Amenity</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Fill in the details to request a new booking.</p>
</div>
<form class="flex flex-col gap-lg bg-surface-container-lowest border border-outline-variant rounded-xl p-md md:p-lg">
<!-- Amenity Selection -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="amenity">Amenity</label>
<div class="relative input-glow rounded-lg border border-outline-variant bg-surface overflow-hidden flex items-center transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant pl-sm">meeting_room</span>
<select class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface py-3 px-sm focus:ring-0 outline-none appearance-none" id="amenity">
<option disabled="" selected="" value="">Select an amenity</option>
<option value="clubhouse">Clubhouse</option>
<option value="bbq">BBQ Area</option>
<option value="tennis">Tennis Court</option>
</select>
<span class="material-symbols-outlined text-on-surface-variant pr-sm pointer-events-none">expand_more</span>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="date">Date</label>
<div class="relative input-glow rounded-lg border border-outline-variant bg-surface overflow-hidden flex items-center transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant pl-sm">calendar_today</span>
<input class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface py-3 px-sm focus:ring-0 outline-none" id="date" type="date"/>
</div>
</div>
<!-- Time Row -->
<div class="flex flex-row gap-md">
<!-- Start Time -->
<div class="flex flex-col gap-xs flex-1">
<label class="font-label-md text-label-md text-on-surface" for="start_time">Start Time</label>
<div class="relative input-glow rounded-lg border border-outline-variant bg-surface overflow-hidden flex items-center transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant pl-sm">schedule</span>
<input class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface py-3 px-sm focus:ring-0 outline-none" id="start_time" type="time"/>
</div>
</div>
<!-- End Time -->
<div class="flex flex-col gap-xs flex-1">
<label class="font-label-md text-label-md text-on-surface" for="end_time">End Time</label>
<div class="relative input-glow rounded-lg border border-outline-variant bg-surface overflow-hidden flex items-center transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant pl-sm">schedule</span>
<input class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface py-3 px-sm focus:ring-0 outline-none" id="end_time" type="time"/>
</div>
</div>
</div>
<!-- Purpose -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="purpose">Purpose of Booking</label>
<div class="relative input-glow rounded-lg border border-outline-variant bg-surface overflow-hidden flex items-start transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant pl-sm pt-3">edit_note</span>
<textarea class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface py-3 px-sm focus:ring-0 outline-none resize-none" id="purpose" placeholder="Briefly describe the event or usage..." rows="3"></textarea>
</div>
</div>
<!-- Submit Button -->
<button class="mt-sm bg-primary text-on-primary font-headline-sm text-headline-sm py-[14px] px-[20px] rounded-lg hover:bg-surface-tint transition-colors w-full flex justify-center items-center gap-xs shadow-sm" type="button">
<span>Submit Request</span>
<span class="material-symbols-outlined">send</span>
</button>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center mt-xs">Requests are typically reviewed within 24 hours.</p>
</form>
</main>
<!-- BottomNavBar Suppressed: This is a linear transactional form screen with a back button. -->
</body></html>
